services:
  postgres:
    image: postgres:16-alpine
    container_name: zeroguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeroguard}
      POSTGRES_USER: ${POSTGRES_USER:-zeroguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeroguard_user} -d ${POSTGRES_DB:-zeroguard}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ml-service:
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    container_name: zeroguard-ml-service
    environment:
      MODEL_PATH: /app/models/isolation_forest_demo.joblib
      PREPROCESSOR_PATH: /app/models/preprocessor_demo.json
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: zeroguard-backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeroguard}
      POSTGRES_USER: ${POSTGRES_USER:-zeroguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-replace_with_a_long_random_development_secret_replace_me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ALERT_RISK_THRESHOLD: ${ALERT_RISK_THRESHOLD:-80}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: zeroguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

