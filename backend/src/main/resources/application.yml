server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: zeroguard-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:zeroguard}
    username: ${POSTGRES_USER:zeroguard_user}
    password: ${POSTGRES_PASSWORD:change_me_local_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

zeroguard:
  jwt:
    secret: ${JWT_SECRET:replace_with_a_long_random_development_secret_replace_me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  alert-risk-threshold: ${ALERT_RISK_THRESHOLD:80}

